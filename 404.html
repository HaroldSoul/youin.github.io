<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#121313" />
    <title>페이지를 찾을 수 없어요 / Page not found - YOU IN?</title>
    <base href="/youin.github.io/" />
    <script>
      /* GitHub serves this document at unknown nested URLs. Resolve from the site root. */
      if (
        location.hostname !== "haroldsoul.github.io" &&
        !location.pathname.startsWith("/youin.github.io/")
      ) {
        document.querySelector("base").href = "/";
      }
    </script>
    <link rel="icon" href="assets/app-icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/styles.css?v=20260922-monochrome" />
  </head>
  <body>
    <header class="header wrap">
      <a class="brand" href="./"
        ><img src="assets/app-icon.svg" width="35" height="35" alt="" /><span
          >YOU IN<i>?</i></span
        ></a
      >
    </header>
    <main class="error-main wrap" id="main" tabindex="-1">
      <div class="error-code" aria-hidden="true">404</div>
      <h1>이 문은 아직 열리지 않았어요.</h1>
      <p>
        주소가 바뀌었거나 존재하지 않는 페이지입니다.<br />홈으로 돌아가 다음
        게임을 만나 보세요.
      </p>
      <a class="button" href="./?lang=ko"
        >홈으로 돌아가기 <span aria-hidden="true">↗</span></a
      >
      <section lang="en">
        <h2>Looks like the wrong door.</h2>
        <p>This page may have moved or does not exist.</p>
        <a href="en/?lang=en">Go to the English homepage ↗</a>
      </section>
    </main>
    <footer class="footer wrap">
      <span>© 2026 YouIN</span>
      <nav
        class="footer-links"
        aria-label="지원 및 정책 / Support and policies"
      >
        <a href="privacy/">개인정보처리방침</a
        ><a href="support/">사용자 지원</a>
      </nav>
    </footer>
  </body>
</html>
